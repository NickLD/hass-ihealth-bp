add_reading:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ihealth_bp
    measured_at:
      required: true
      selector:
        datetime:
    systolic:
      required: true
      selector:
        number:
          min: 40
          max: 300
          unit_of_measurement: mmHg
          mode: box
    diastolic:
      required: true
      selector:
        number:
          min: 20
          max: 250
          unit_of_measurement: mmHg
          mode: box
    pulse:
      required: true
      selector:
        number:
          min: 20
          max: 250
          unit_of_measurement: bpm
          mode: box
    irregular_pulse:
      required: false
      default: false
      selector:
        boolean:
    body_movement:
      required: false
      default: false
      selector:
        boolean:
delete_reading:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ihealth_bp
    measured_at:
      required: true
      selector:
        datetime:
delete_session:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ihealth_bp
    measured_at:
      required: true
      selector:
        datetime:
set_reading_context:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ihealth_bp
    measured_at:
      required: true
      selector:
        datetime:
    session:
      required: false
      default: false
      selector:
        boolean:
    flags:
      required: false
      selector:
        select:
          multiple: true
          mode: list
          translation_key: flags
          options:
            - caffeine
            - ate
            - exertion
            - after_shower
            - poor_sleep
            - alcohol
            - stressed
            - missed_meds
            - sick
    add_flags:
      required: false
      selector:
        select:
          multiple: true
          mode: list
          translation_key: flags
          options:
            - caffeine
            - ate
            - exertion
            - after_shower
            - poor_sleep
            - alcohol
            - stressed
            - missed_meds
            - sick
    note:
      required: false
      selector:
        text:
